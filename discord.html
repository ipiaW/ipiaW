<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 400px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        /* Minimalist title if needed */
        .title {
            font-size: 18px;
            font-weight: 300;
            color: #777;
            margin-bottom: 50px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 40px;
        }

        .link-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: white;
            box-shadow: 
                0 10px 20px rgba(0, 0, 0, 0.05),
                0 6px 6px rgba(0, 0, 0, 0.03),
                inset 0 0 0 1px rgba(255, 255, 255, 0.8);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .link-button:hover::before {
            opacity: 1;
        }

        .link-button:hover {
            transform: translateY(-8px);
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.1),
                0 10px 10px rgba(0, 0, 0, 0.05),
                inset 0 0 0 1px rgba(255, 255, 255, 0.9);
        }

        .link-icon {
            font-size: 32px;
            transition: all 0.3s ease;
        }

        .link-button:hover .link-icon {
            transform: scale(1.2);
        }

        /* Specific colors for each button */
        .saweria {
            color: #ff6b35;
        }

        .youtube {
            color: #ff0000;
        }

        /* Minimalist footer */
        footer {
            margin-top: 60px;
            text-align: center;
            color: #aaa;
            font-size: 12px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* Responsive design */
        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }
            
            .link-button {
                padding: 22px;
            }
            
            .link-icon {
                font-size: 28px;
            }
        }

        /* Minimal animation for page load */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .link-button, footer {
            animation: fadeIn 0.6s ease forwards;
            opacity: 0;
        }

        .link-button:nth-child(1) { animation-delay: 0.1s; }
        .link-button:nth-child(2) { animation-delay: 0.2s; }
        footer { animation-delay: 0.3s; }

        /* Simple hover effect for buttons */
        .link-button:active {
            transform: translateY(-4px);
        }

        /* Optional: Very subtle background pattern */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 182, 193, 0.03) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 182, 193, 0.03) 0%, transparent 20%);
            z-index: -1;
            pointer-events: none;
        }

        /* Mode gelap */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                color: #f0f0f0;
            }
            
            .link-button {
                background: rgba(30, 30, 46, 0.8);
                box-shadow: 
                    0 10px 20px rgba(0, 0, 0, 0.2),
                    0 6px 6px rgba(0, 0, 0, 0.1),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            }
            
            .link-button:hover {
                box-shadow: 
                    0 20px 40px rgba(0, 0, 0, 0.3),
                    0 10px 10px rgba(0, 0, 0, 0.2),
                    inset 0 0 0 1px rgba(255, 255, 255, 0.08);
            }
            
            .bg-pattern {
                background-image: 
                    radial-gradient(circle at 10% 20%, rgba(108, 92, 231, 0.05) 0%, transparent 20%),
                    radial-gradient(circle at 90% 80%, rgba(108, 92, 231, 0.05) 0%, transparent 20%);
            }
            
            footer {
                color: #777;
            }
        }
    </style>
</head>
<body>
    <!-- Background pattern yang sangat subtle -->
    <div class="bg-pattern"></div>
    
    <div class="container">
        <!-- Tidak ada title jika tidak diperlukan -->
        <!-- <h1 class="title">Links</h1> -->
        
        <div class="links">
            <a href="https://saweria.co" target="_blank" class="link-button saweria">
                <div class="link-icon">
                    <i class="fas fa-heart"></i>
                </div>
            </a>
            
            <a href="https://youtube.com" target="_blank" class="link-button youtube">
                <div class="link-icon">
                    <i class="fab fa-youtube"></i>
                </div>
            </a>
        </div>
        
        <footer>
            <p>© 2023</p>
        </footer>
    </div>

    <script>
        // Interaksi minimal untuk tombol
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.link-button');
            
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // Efek tekan
                    this.style.transform = 'translateY(-4px) scale(0.98)';
                    
                    // Kembalikan setelah 150ms
                    setTimeout(() => {
                        this.style.transform = 'translateY(-8px)';
                    }, 150);
                    
                    // Buka link setelah delay kecil
                    setTimeout(() => {
                        window.open(this.href, '_blank');
                    }, 200);
                });
                
                // Efek hover untuk ikon
                button.addEventListener('mouseenter', function() {
                    const icon = this.querySelector('.link-icon');
                    icon.style.transform = 'scale(1.2)';
                });
                
                button.addEventListener('mouseleave', function() {
                    const icon = this.querySelector('.link-icon');
                    if (!this.classList.contains('clicked')) {
                        icon.style.transform = 'scale(1)';
                    }
                });
            });
            
            // Animasi muncul bertahap
            const elements = document.querySelectorAll('.link-button, footer');
            
            setTimeout(() => {
                elements.forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            }, 100);
            
            // Efek ripple sederhana
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // Buat lingkaran ripple
                    const circle = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    circle.style.cssText = `
                        position: absolute;
                        border-radius: 50%;
                        background: rgba(255, 255, 255, 0.3);
                        transform: scale(0);
                        animation: ripple 0.6s linear;
                        width: ${size}px;
                        height: ${size}px;
                        top: ${y}px;
                        left: ${x}px;
                        pointer-events: none;
                    `;
                    
                    this.appendChild(circle);
                    
                    setTimeout(() => {
                        circle.remove();
                    }, 600);
                });
            });
            
            // Tambahkan animasi ripple ke stylesheet
            const style = document.createElement('style');
            style.textContent = `
                @keyframes ripple {
                    to {
                        transform: scale(4);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
