<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            color: #5865f2;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 40px;
        }

        .discord-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 30px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background: #5865f2;
            box-shadow: 0 10px 20px rgba(88, 101, 242, 0.2);
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }

        .discord-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .discord-button:hover::before {
            opacity: 1;
        }

        .discord-button:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(88, 101, 242, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
            background: #4752c4;
        }

        .discord-button:active {
            transform: translateY(-4px);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #666;
            font-size: 14px;
            font-weight: 300;
        }

        /* Variasi warna untuk tombol kedua */
        .discord-button.secondary {
            background: #7289da;
            box-shadow: 0 10px 20px rgba(114, 137, 218, 0.2);
        }

        .discord-button.secondary:hover {
            background: #5c73c4;
            box-shadow: 0 20px 40px rgba(114, 137, 218, 0.3);
        }

        /* Animasi untuk elemen */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title, .discord-button, footer {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .discord-button:nth-child(1) { animation-delay: 0.1s; }
        .discord-button:nth-child(2) { animation-delay: 0.2s; }
        footer { animation-delay: 0.3s; }

        /* Responsive design */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 22px;
                margin-bottom: 30px;
            }
            
            .discord-button {
                padding: 22px 25px;
                font-size: 17px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 25px 15px;
            }
            
            .title {
                font-size: 20px;
            }
            
            .discord-button {
                padding: 20px;
                font-size: 16px;
            }
        }

        /* Mode gelap */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                color: #f0f0f0;
            }
            
            .title {
                color: #7289da;
            }
            
            .discord-button {
                background: #5865f2;
            }
            
            .discord-button:hover {
                background: #4752c4;
            }
            
            .discord-button.secondary {
                background: #7289da;
            }
            
            .discord-button.secondary:hover {
                background: #5c73c4;
            }
            
            footer {
                color: #aaa;
            }
        }

        /* Efek ripple untuk tombol */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Dekorasi minimal di background */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(88, 101, 242, 0.05) 0%, rgba(88, 101, 242, 0) 70%);
            z-index: -1;
        }

        .bg-circle:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -100px;
            right: -100px;
        }

        .bg-circle:nth-child(2) {
            width: 250px;
            height: 250px;
            bottom: -80px;
            left: -80px;
        }
    </style>
</head>
<body>
    <!-- Dekorasi background minimal -->
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    
    <div class="container">
        <h1 class="title">Discord Servers</h1>
        
        <div class="links">
            <a href="https://discord.com" target="_blank" class="discord-button">
                Join Main Discord Server
            </a>
            
            <a href="https://discord.com" target="_blank" class="discord-button secondary">
                Join Community Discord Server
            </a>
        </div>
        
        <footer>
            <p>© 2023 • Connect with us on Discord</p>
        </footer>
    </div>

    <script>
        // Efek ripple untuk tombol
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.discord-button');
            
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // Buat efek ripple
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.classList.add('ripple');
                    ripple.style.width = `${size}px`;
                    ripple.style.height = `${size}px`;
                    ripple.style.top = `${y}px`;
                    ripple.style.left = `${x}px`;
                    
                    this.appendChild(ripple);
                    
                    // Hapus ripple setelah animasi selesai
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                    
                    // Efek tekan
                    this.style.transform = 'translateY(-4px)';
                    
                    // Kembalikan setelah 150ms
                    setTimeout(() => {
                        this.style.transform = 'translateY(-8px)';
                    }, 150);
                    
                    // Buka link setelah delay kecil
                    setTimeout(() => {
                        window.open(this.href, '_blank');
                    }, 300);
                });
                
                // Efek hover
                button.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-8px)';
                });
                
                button.addEventListener('mouseleave', function() {
                    if (!this.classList.contains('clicked')) {
                        this.style.transform = 'translateY(0)';
                    }
                });
            });
            
            // Animasi muncul bertahap
            const elements = document.querySelectorAll('.title, .discord-button, footer');
            
            setTimeout(() => {
                elements.forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            }, 100);
        });
    </script>
</body>
</html>
