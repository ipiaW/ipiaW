<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Universe | Your Name</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div class="loader">
        <div class="loader-circle"></div>
        <p class="loader-text">Loading Universe...</p>
    </div>

    <!-- Animated Background -->
    <div class="animated-bg">
        <div class="particle" style="--i:0;"></div>
        <div class="particle" style="--i:1;"></div>
        <div class="particle" style="--i:2;"></div>
        <div class="particle" style="--i:3;"></div>
        <div class="particle" style="--i:4;"></div>
        <div class="particle" style="--i:5;"></div>
    </div>

    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <!-- Main Content -->
    <div class="container">
        <div class="profile-card" data-tilt>
            <!-- Glow Border -->
            <div class="glow-border"></div>
            
            <!-- Profile Image with Glitch Effect -->
            <div class="profile-wrapper">
                <div class="profile-image">
                    <img src="https://i.pravatar.cc/200?img=3" alt="Profile">
                </div>
                <div class="profile-image glitch-layer"></div>
            </div>

            <!-- Animated Name -->
            <h1 class="name">
                <span class="typewriter">Your Name</span>
                <span class="cursor-text">|</span>
            </h1>

            <!-- Dynamic Bio -->
            <p class="bio">
                <span class="word-change" data-words="Content Creator,Digital Artist,Game Developer,Creative Mind"></span>
            </p>

            <!-- Social Buttons (Morphing) -->
            <div class="button-grid">
                <a href="https://saweria.co/yourusername" target="_blank" class="morph-btn saweria-btn">
                    <span class="btn-icon"><i class="fas fa-coffee"></i></span>
                    <span class="btn-text">Saweria</span>
                    <span class="btn-bg"></span>
                </a>

                <a href="https://youtube.com/@yourusername" target="_blank" class="morph-btn youtube-btn">
                    <span class="btn-icon"><i class="fab fa-youtube"></i></span>
                    <span class="btn-text">YouTube</span>
                    <span class="btn-bg"></span>
                </a>

                <a href="https://discord.gg/yourinvite" target="_blank" class="morph-btn discord-btn">
                    <span class="btn-icon"><i class="fab fa-discord"></i></span>
                    <span class="btn-text">Discord</span>
                    <span class="btn-bg"></span>
                </a>

                <a href="https://tiktok.com/@yourusername" target="_blank" class="morph-btn tiktok-btn">
                    <span class="btn-icon"><i class="fab fa-tiktok"></i></span>
                    <span class="btn-text">TikTok</span>
                    <span class="btn-bg"></span>
                </a>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" data-target="1.2K">0</span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" data-target="50">0</span>
                    <span class="stat-label">Projects</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" data-target="98">0</span>
                    <span class="stat-label">% Positive</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer with Floating Animation -->
    <footer class="floating-footer">
        <p>&copy; 2024 Your Universe. Crafted with <i class="fas fa-heart pulse"></i> & Magic</p>
    </footer>

    <!-- JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
