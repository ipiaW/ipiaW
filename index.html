<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waaaipi!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Waaaipi!</h1>
            <p>Terima kasih sudah berkunjung!</p>
        </header>
        
        <main>
            <div class="links-container">
                <h2>Donasi</h2>
                <div class="links-grid">
                    <a href="https://trakteer.id" target="_blank" class="link-card trakteer">
                        <i class="fas fa-hand-holding-heart"></i>
                        <span>Trakteer</span>
                    </a>
                    
                    <a href="https://saweria.co" target="_blank" class="link-card saweria">
                        <i class="fas fa-coins"></i>
                        <span>Saweria</span>
                    </a>
                </div>
                
                <h2>Sosial Media</h2>
                <div class="links-grid">
                    <a href="https://discord.com" target="_blank" class="link-card discord">
                        <i class="fab fa-discord"></i>
                        <span>Discord</span>
                    </a>
                    
                    <a href="https://instagram.com" target="_blank" class="link-card instagram">
                        <i class="fab fa-instagram"></i>
                        <span>Instagram</span>
                    </a>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2023 Waaaipi! - Semua link akan membuka tab baru</p>
        </footer>
    </div>
</body>
</html>
