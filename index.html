<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waaaipi!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* Header Styles */
        header {
            text-align: center;
            padding: 40px 30px;
            background: linear-gradient(135deg, #6e45e2 0%, #88d3ce 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);
            transform: rotate(30deg);
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        header h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: 800;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
        }

        /* Main Content Styles */
        main {
            padding: 40px 30px;
        }

        .links-container {
            position: relative;
        }

        .links-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #6e45e2;
            font-size: 2rem;
            position: relative;
            padding-bottom: 15px;
            font-weight: 700;
        }

        .links-container h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, #6e45e2, #88d3ce);
            border-radius: 2px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 25px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 1.3rem;
            transition: all 0.4s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            min-height: 180px;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.3));
            z-index: -1;
        }

        .link-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            z-index: -2;
            filter: brightness(0.9);
        }

        .link-card i {
            font-size: 3rem;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .link-card span {
            position: relative;
            z-index: 2;
        }

        .link-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
        }

        .link-card:hover i {
            transform: scale(1.2) rotate(5deg);
        }

        /* Warna khusus untuk setiap link */
        .trakteer {
            background: linear-gradient(135deg, #ff5f6d, #ffc371);
        }

        .saweria {
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
        }

        .discord {
            background: linear-gradient(135deg, #7289da, #5a6fc2);
        }

        .instagram {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            background-size: 200% 200%;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating elements */
        .floating {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            animation: float 8s infinite ease-in-out;
        }

        .floating:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating:nth-child(2) {
            width: 50px;
            height: 50px;
            top: 60%;
            left: 5%;
            animation-delay: 1s;
        }

        .floating:nth-child(3) {
            width: 70px;
            height: 70px;
            top: 30%;
            right: 10%;
            animation-delay: 2s;
        }

        .floating:nth-child(4) {
            width: 40px;
            height: 40px;
            top: 70%;
            right: 5%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* Footer Styles */
        footer {
            text-align: center;
            padding: 25px;
            background-color: rgba(245, 245, 245, 0.8);
            color: #666;
            font-size: 1rem;
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5%;
            width: 90%;
            height: 1px;
            background: linear-gradient(to right, transparent, #6e45e2, transparent);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 2.2rem;
            }
            
            .logo {
                font-size: 2.8rem;
            }
            
            .links-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .link-card {
                min-height: 150px;
                padding: 25px 20px;
            }
            
            .floating {
                display: none;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 30px 20px;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            header p {
                font-size: 1rem;
            }
            
            .logo {
                font-size: 2.2rem;
            }
            
            .links-container h2 {
                font-size: 1.6rem;
            }
            
            .link-card {
                min-height: 130px;
                padding: 20px 15px;
                font-size: 1.1rem;
            }
            
            .link-card i {
                font-size: 2.5rem;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Floating elements for background -->
        <div class="floating"></div>
        <div class="floating"></div>
        <div class="floating"></div>
        <div class="floating"></div>
        
        <header>
            <div class="logo">✨</div>
            <h1>Waaaipi!</h1>
            <p>Terima kasih sudah berkunjung! Dukung saya dengan berdonasi atau ikuti sosial media saya.</p>
        </header>
        
        <main>
            <div class="links-container">
                <h2>Donasi</h2>
                <div class="links-grid">
                    <a href="https://trakteer.id" target="_blank" class="link-card trakteer">
                        <i class="fas fa-hand-holding-heart"></i>
                        <span>Trakteer</span>
                    </a>
                    
                    <a href="https://saweria.co" target="_blank" class="link-card saweria">
                        <i class="fas fa-coins"></i>
                        <span>Saweria</span>
                    </a>
                </div>
                
                <h2>Sosial Media</h2>
                <div class="links-grid">
                    <a href="https://discord.com" target="_blank" class="link-card discord">
                        <i class="fab fa-discord"></i>
                        <span>Discord</span>
                    </a>
                    
                    <a href="https://instagram.com" target="_blank" class="link-card instagram">
                        <i class="fab fa-instagram"></i>
                        <span>Instagram</span>
                    </a>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2023 Waaaipi! - Semua link akan membuka tab baru</p>
        </footer>
    </div>

    <script>
        // Menambahkan efek ketikan untuk judul
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.querySelector('header h1');
            const originalText = header.textContent;
            header.textContent = '';
            
            let i = 0;
            const typeWriter = () => {
                if (i < originalText.length) {
                    header.textContent += originalText.charAt(i);
                    i++;
                    setTimeout(typeWriter, 100);
                }
            };
            
            typeWriter();
            
            // Efek hover untuk kartu link
            const cards = document.querySelectorAll('.link-card');
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    cards.forEach(otherCard => {
                        if (otherCard !== card) {
                            otherCard.style.filter = 'blur(2px)';
                        }
                    });
                });
                
                card.addEventListener('mouseleave', () => {
                    cards.forEach(otherCard => {
                        otherCard.style.filter = 'blur(0)';
                    });
                });
            });
        });
    </script>
</body>
</html>
