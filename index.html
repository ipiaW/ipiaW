<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waaaipi!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6e45e2;
            --secondary: #88d3ce;
            --accent1: #ff5f6d;
            --accent2: #4e54c8;
            --accent3: #7289da;
            --accent4: #833ab4;
            --dark: #1a1a2e;
            --light: #ffffff;
            --gray: #f8f9fa;
            --text: #2d3436;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 1100px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 50px 30px;
            position: relative;
            overflow: hidden;
        }

        .header-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            opacity: 0.8;
            z-index: -1;
        }

        .header-content {
            position: relative;
            z-index: 2;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 15px;
            display: inline-block;
            background: linear-gradient(135deg, #ff5f6d, #ffc371);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
        }

        header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.5rem;
            margin-bottom: 15px;
            font-weight: 800;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
            background: linear-gradient(to right, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            font-size: 1.3rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            font-weight: 300;
        }

        .wave-divider {
            position: relative;
            height: 50px;
            overflow: hidden;
        }

        .wave-divider svg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        main {
            padding: 40px 30px;
        }

        .links-container {
            position: relative;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            color: var(--light);
            font-size: 2.2rem;
            position: relative;
            padding-bottom: 15px;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 25px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 1.4rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            min-height: 200px;
            position: relative;
            overflow: hidden;
            z-index: 1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            z-index: -1;
        }

        .link-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            z-index: -2;
            filter: brightness(0.9);
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            transition: all 0.4s ease;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
        }

        .card-text {
            position: relative;
            z-index: 2;
            font-family: 'Montserrat', sans-serif;
        }

        .link-card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .link-card:hover .card-icon {
            transform: scale(1.2) rotate(5deg);
        }

        /* Warna khusus untuk setiap link */
        .trakteer {
            background: linear-gradient(135deg, #ff5f6d, #ffc371);
        }

        .saweria {
            background: linear-gradient(135deg, #4e54c8, #8f94fb);
        }

        .discord {
            background: linear-gradient(135deg, #7289da, #5a6fc2);
        }

        .instagram {
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            background-size: 200% 200%;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Particle effect */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        footer {
            text-align: center;
            padding: 30px;
            background-color: rgba(0, 0, 0, 0.2);
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            position: relative;
        }

        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 5%;
            width: 90%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            header h1 {
                font-size: 2.8rem;
            }
            
            .logo {
                font-size: 3.5rem;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 40px 20px;
            }
            
            header h1 {
                font-size: 2.5rem;
            }
            
            .logo {
                font-size: 3rem;
            }
            
            header p {
                font-size: 1.1rem;
            }
            
            .links-grid {
                grid-template-columns: 1fr;
                gap: 25px;
            }
            
            .link-card {
                min-height: 180px;
                padding: 30px 20px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 30px 15px;
            }
            
            header h1 {
                font-size: 2rem;
            }
            
            .logo {
                font-size: 2.5rem;
            }
            
            header p {
                font-size: 1rem;
            }
            
            .section-title {
                font-size: 1.8rem;
            }
            
            .link-card {
                min-height: 160px;
                padding: 25px 15px;
                font-size: 1.2rem;
            }
            
            .card-icon {
                font-size: 3rem;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Background stars -->
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <header>
            <div class="header-bg"></div>
            <div class="header-content">
                <div class="logo">✨</div>
                <h1>Waaaipi!</h1>
                <p>Terima kasih sudah berkunjung! Dukung saya dengan berdonasi atau ikuti sosial media saya.</p>
            </div>
        </header>
        
        <div class="wave-divider">
            <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
                <path d="M0,0V46.29c47.79,22.2,103.59,32.17,158,28,70.36-5.37,136.33-33.31,206.8-37.5C438.64,32.43,512.34,53.67,583,72.05c69.27,18,138.3,24.88,209.4,13.08,36.15-6,69.85-17.84,104.45-29.34C989.49,25,1113-14.29,1200,52.47V0Z" opacity=".25" class="shape-fill"></path>
                <path d="M0,0V15.81C13,36.92,27.64,56.86,47.69,72.05,99.41,111.27,165,111,224.58,91.58c31.15-10.15,60.09-26.07,89.67-39.8,40.92-19,84.73-46,130.83-49.67,36.26-2.85,70.9,9.42,98.6,31.56,31.77,25.39,62.32,62,103.63,73,40.44,10.79,81.35-6.69,119.13-24.28s75.16-39,116.92-43.05c59.73-5.85,113.28,22.88,168.9,38.84,30.2,8.66,59,6.17,87.09-7.5,22.43-10.89,48-26.93,60.65-49.24V0Z" opacity=".5" class="shape-fill"></path>
                <path d="M0,0V5.63C149.93,59,314.09,71.32,475.83,42.57c43-7.64,84.23-20.12,127.61-26.46,59-8.63,112.48,12.24,165.56,35.4C827.93,77.22,886,95.24,951.2,90c86.53-7,172.46-45.71,248.8-84.81V0Z" class="shape-fill"></path>
            </svg>
        </div>
        
        <main>
            <div class="links-container">
                <!-- Particles for background -->
                <div class="particles" id="particles"></div>
                
                <h2 class="section-title">Donasi</h2>
                <div class="links-grid">
                    <a href="https://trakteer.id/ipiaaaW" target="_blank" class="link-card trakteer">
                        <i class="fas fa-hand-holding-heart card-icon"></i>
                        <span class="card-text">Trakteer</span>
                    </a>
                    
                    <a href="https://saweria.co/ipiaaaW" target="_blank" class="link-card saweria">
                        <i class="fas fa-coins card-icon"></i>
                        <span class="card-text">Saweria</span>
                    </a>
                </div>
                
                <h2 class="section-title">Sosial Media</h2>
                <div class="links-grid">
                    <a href="https://discord.com" target="_blank" class="link-card discord">
                        <i class="fab fa-discord card-icon"></i>
                        <span class="card-text">Discord</span>
                    </a>
                    
                    <a href="https://instagram.com" target="_blank" class="link-card instagram">
                        <i class="fab fa-instagram card-icon"></i>
                        <span class="card-text">Instagram</span>
                    </a>
                </div>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2025 Waaaipi</p>
        </footer>
    </div>

    <script>
        // Create stars for background
        function createStars() {
            const stars = document.getElementById('stars');
            const starsCount = 150;
            
            for (let i = 0; i < starsCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                const size = Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                star.style.animationDuration = `${Math.random() * 3 + 2}s`;
                star.style.animationDelay = `${Math.random() * 2}s`;
                
                stars.appendChild(star);
            }
        }
        
        // Create particles for decoration
        function createParticles() {
            const particles = document.getElementById('particles');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 20 + 10;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                particle.style.animationDuration = `${Math.random() * 10 + 5}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
                
                // Random color based on theme
                const colors = [
                    'rgba(110, 69, 226, 0.4)',
                    'rgba(136, 211, 206, 0.4)',
                    'rgba(255, 95, 109, 0.4)',
                    'rgba(78, 84, 200, 0.4)'
                ];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                particles.appendChild(particle);
            }
        }
        
        // Typewriter effect for title
        function typeWriter() {
            const title = document.querySelector('header h1');
            const originalText = title.textContent;
            title.textContent = '';
            
            let i = 0;
            const type = () => {
                if (i < originalText.length) {
                    title.textContent += originalText.charAt(i);
                    i++;
                    setTimeout(type, 100);
                }
            };
            
            // Start typing after a short delay
            setTimeout(type, 500);
        }
        
        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            createParticles();
            typeWriter();
            
            // Add hover effect to cards
            const cards = document.querySelectorAll('.link-card');
            cards.forEach(card => {
                card.addEventListener('mouseenter', () => {
                    cards.forEach(otherCard => {
                        if (otherCard !== card) {
                            otherCard.style.filter = 'blur(2px) brightness(0.8)';
                        }
                    });
                });
                
                card.addEventListener('mouseleave', () => {
                    cards.forEach(otherCard => {
                        otherCard.style.filter = 'none';
                    });
                });
            });
        });
    </script>
</body>
</html>
