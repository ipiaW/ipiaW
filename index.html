<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9ff 0%, #eef1ff 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 700px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 50px;
        }

        .title {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #718096;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-bottom: 50px;
        }

        .social-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-height: 160px;
        }

        .social-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .social-button:hover::before {
            opacity: 1;
        }

        .social-button:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .social-icon {
            font-size: 36px;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }

        .social-button:hover .social-icon {
            transform: scale(1.2) rotate(5deg);
        }

        .social-text {
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        /* Warna untuk setiap tombol */
        .saweria {
            background: linear-gradient(135deg, #FF6B35 0%, #FFA62E 100%);
        }

        .tiktok {
            background: linear-gradient(135deg, #000000 0%, #25F4EE 50%, #FE2C55 100%);
            background-size: 200% 200%;
            animation: tiktok-gradient 3s ease infinite;
        }

        .youtube {
            background: linear-gradient(135deg, #FF0000 0%, #C4302B 100%);
        }

        .discord {
            background: linear-gradient(135deg, #5865F2 0%, #7289DA 100%);
        }

        /* Animasi khusus untuk TikTok */
        @keyframes tiktok-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #718096;
            font-size: 14px;
            font-weight: 400;
            padding-top: 25px;
            border-top: 1px solid rgba(113, 128, 150, 0.1);
            width: 100%;
        }

        /* Animasi untuk elemen */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header, .social-button, footer {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .social-button:nth-child(1) { animation-delay: 0.1s; }
        .social-button:nth-child(2) { animation-delay: 0.2s; }
        .social-button:nth-child(3) { animation-delay: 0.3s; }
        .social-button:nth-child(4) { animation-delay: 0.4s; }
        footer { animation-delay: 0.5s; }

        /* Responsive design */
        @media (max-width: 700px) {
            .links-grid {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: 0 auto 50px;
            }
            
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 15px;
            }
            
            .social-button {
                padding: 30px 20px;
                min-height: 140px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 15px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .social-button {
                padding: 25px 20px;
                min-height: 130px;
            }
            
            .social-icon {
                font-size: 32px;
            }
            
            .social-text {
                font-size: 15px;
            }
        }

        /* Mode gelap */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                color: #f0f0f0;
            }
            
            .title {
                color: #e2e8f0;
            }
            
            .subtitle {
                color: #a0aec0;
            }
            
            footer {
                color: #a0aec0;
                border-top: 1px solid rgba(160, 174, 192, 0.1);
            }
        }

        /* Efek ripple untuk tombol */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Dekorasi background minimal */
        .bg-element {
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            opacity: 0.05;
        }

        .bg-element:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #FF6B35;
            top: -100px;
            right: -100px;
        }

        .bg-element:nth-child(2) {
            width: 250px;
            height: 250px;
            background: #5865F2;
            bottom: -80px;
            left: -80px;
        }

        .bg-element:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #FF0000;
            top: 40%;
            left: 10%;
        }
    </style>
</head>
<body>
    <!-- Dekorasi background minimal -->
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">Social Links</h1>
            <p class="subtitle">Connect with me on different platforms for content, support, and community</p>
        </div>
        
        <div class="links-grid">
            <a href="https://saweria.co" target="_blank" class="social-button saweria">
                <div class="social-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="social-text">Saweria</div>
            </a>
            
            <a href="https://tiktok.com" target="_blank" class="social-button tiktok">
                <div class="social-icon">
                    <i class="fab fa-tiktok"></i>
                </div>
                <div class="social-text">TikTok</div>
            </a>
            
            <a href="https://youtube.com" target="_blank" class="social-button youtube">
                <div class="social-icon">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="social-text">YouTube</div>
            </a>
            
            <a href="https://discord.com" target="_blank" class="social-button discord">
                <div class="social-icon">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="social-text">Discord</div>
            </a>
        </div>
        
        <footer>
            <p>© 2023 • All social media links</p>
        </footer>
    </div>

    <script>
        // Efek ripple untuk tombol
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.social-button');
            
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // Buat efek ripple
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.classList.add('ripple');
                    ripple.style.width = `${size}px`;
                    ripple.style.height = `${size}px`;
                    ripple.style.top = `${y}px`;
                    ripple.style.left = `${x}px`;
                    
                    this.appendChild(ripple);
                    
                    // Hapus ripple setelah animasi selesai
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                    
                    // Efek tekan
                    this.style.transform = 'translateY(-5px) scale(0.98)';
                    
                    // Kembalikan setelah 150ms
                    setTimeout(() => {
                        this.style.transform = 'translateY(-10px)';
                    }, 150);
                    
                    // Buka link setelah delay kecil
                    setTimeout(() => {
                        window.open(this.href, '_blank');
                    }, 300);
                });
                
                // Efek hover untuk ikon
                button.addEventListener('mouseenter', function() {
                    const icon = this.querySelector('.social-icon');
                    icon.style.transform = 'scale(1.2) rotate(5deg)';
                });
                
                button.addEventListener('mouseleave', function() {
                    const icon = this.querySelector('.social-icon');
                    if (!this.classList.contains('clicked')) {
                        icon.style.transform = 'scale(1) rotate(0deg)';
                    }
                });
            });
            
            // Animasi muncul bertahap
            const elements = document.querySelectorAll('.header, .social-button, footer');
            
            setTimeout(() => {
                elements.forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            }, 100);
        });
    </script>
</body>
</html>
