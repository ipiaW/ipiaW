<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waaaipi Universe</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: linear-gradient(135deg, #ffe6f2 0%, #ffccdd 100%);
            --card-color: rgba(255, 255, 255, 0.92);
            --text-color: #5a3d5c;
            --text-light: #9d7b9f;
            --accent-color: #ff6b9d;
            --border-color: rgba(255, 255, 255, 0.4);
            --shadow: 0 15px 35px rgba(255, 150, 200, 0.15);
            --shadow-hover: 0 20px 40px rgba(255, 150, 200, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        /* Latar belakang dekoratif dengan pink pastel */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.7;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.3) 0%, rgba(255, 182, 193, 0) 70%);
        }

        .circle:nth-child(1) {
            width: 400px;
            height: 400px;
            top: -200px;
            right: -150px;
        }

        .circle:nth-child(2) {
            width: 300px;
            height: 300px;
            bottom: -150px;
            left: -100px;
        }

        .circle:nth-child(3) {
            width: 250px;
            height: 250px;
            top: 30%;
            left: 10%;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-color);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 50px 40px;
            text-align: center;
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        /* Efek gradien atas dengan warna pink */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #ffb6c1, #ffc0cb, #ffccdd, #ffd6e7, #ffccdd, #ffc0cb, #ffb6c1);
            background-size: 300% 100%;
            animation: shimmer 6s linear infinite;
        }

        @keyframes shimmer {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        .profile {
            margin-bottom: 50px;
            position: relative;
        }

        .avatar-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            margin: 0 auto 25px;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(255, 150, 200, 0.2);
            position: relative;
            transition: transform 0.5s ease;
        }

        .avatar-container:hover {
            transform: scale(1.05);
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 500;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .description {
            font-size: 17px;
            color: var(--text-light);
            max-width: 450px;
            margin: 0 auto 40px;
            font-weight: 300;
            line-height: 1.7;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .link-button {
            display: flex;
            align-items: center;
            padding: 22px 28px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 17px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 5px 15px rgba(255, 150, 200, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .link-button:hover::before {
            opacity: 1;
        }

        .link-button:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }

        .link-icon {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 20px;
            font-size: 22px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ffe6f2 0%, #ffccdd 100%);
            color: var(--text-color);
            transition: all 0.4s ease;
            z-index: 1;
        }

        .link-button:hover .link-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .link-text {
            flex-grow: 1;
            text-align: left;
            font-weight: 500;
            z-index: 1;
        }

        .link-arrow {
            color: var(--text-light);
            font-size: 16px;
            transition: all 0.4s ease;
            z-index: 1;
        }

        .link-button:hover .link-arrow {
            transform: translateX(8px);
            color: var(--accent-color);
        }

        /* Warna khusus untuk setiap tombol dengan tema pink */
        .saweria:hover {
            border-color: rgba(255, 107, 53, 0.2);
            background: linear-gradient(to right, rgba(255, 255, 255, 0.9), rgba(255, 107, 53, 0.05));
        }

        .youtube:hover {
            border-color: rgba(255, 0, 0, 0.2);
            background: linear-gradient(to right, rgba(255, 255, 255, 0.9), rgba(255, 0, 0, 0.05));
        }

        .discord:hover {
            border-color: rgba(88, 101, 242, 0.2);
            background: linear-gradient(to right, rgba(255, 255, 255, 0.9), rgba(88, 101, 242, 0.05));
        }

        .tiktok:hover {
            border-color: rgba(0, 0, 0, 0.2);
            background: linear-gradient(to right, rgba(255, 255, 255, 0.9), rgba(0, 0, 0, 0.05));
        }

        /* Ikon dengan warna brand dan background pink pastel */
        .saweria .link-icon {
            color: #ff6b35;
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1) 0%, rgba(255, 166, 46, 0.1) 100%);
        }

        .youtube .link-icon {
            color: #ff0000;
            background: linear-gradient(135deg, rgba(255, 0, 0, 0.1) 0%, rgba(196, 48, 43, 0.1) 100%);
        }

        .discord .link-icon {
            color: #5865f2;
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.1) 0%, rgba(114, 137, 218, 0.1) 100%);
        }

        .tiktok .link-icon {
            color: #000000;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.1) 0%, rgba(37, 244, 238, 0.1) 50%, rgba(254, 44, 85, 0.1) 100%);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 182, 193, 0.3);
            width: 100%;
            font-weight: 300;
        }

        .footer-text {
            margin-bottom: 15px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
        }

        .social-icons a {
            color: var(--text-light);
            font-size: 18px;
            transition: all 0.4s ease;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
        }

        .social-icons a:hover {
            color: var(--accent-color);
            transform: translateY(-5px);
            background: white;
            box-shadow: 0 5px 15px rgba(255, 150, 200, 0.2);
        }

        /* Animasi untuk elemen */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile, .link-button, footer {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .link-button:nth-child(1) { animation-delay: 0.1s; }
        .link-button:nth-child(2) { animation-delay: 0.2s; }
        .link-button:nth-child(3) { animation-delay: 0.3s; }
        .link-button:nth-child(4) { animation-delay: 0.4s; }
        footer { animation-delay: 0.5s; }

        /* Efek bunga jatuh */
        .flower {
            position: fixed;
            top: -50px;
            font-size: 20px;
            color: rgba(255, 182, 193, 0.5);
            z-index: 0;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive design */
        @media (max-width: 700px) {
            .container {
                padding: 40px 25px;
                border-radius: 20px;
            }
            
            h1 {
                font-size: 30px;
            }
            
            .description {
                font-size: 16px;
            }
            
            .link-button {
                padding: 20px 24px;
            }
            
            .avatar-container {
                width: 110px;
                height: 110px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 26px;
            }
            
            .link-button {
                padding: 18px 20px;
            }
            
            .link-icon {
                width: 45px;
                height: 45px;
                margin-right: 15px;
                font-size: 20px;
            }
            
            .link-text {
                font-size: 16px;
            }
        }

        /* Mode gelap dengan tema pink tua */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: linear-gradient(135deg, #4a2c40 0%, #6d3b5e 100%);
                --card-color: rgba(90, 61, 92, 0.9);
                --text-color: #ffe6f2;
                --text-light: #d8b4d8;
                --border-color: rgba(255, 255, 255, 0.1);
                --shadow: 0 15px 35px rgba(90, 61, 92, 0.3);
                --shadow-hover: 0 20px 40px rgba(90, 61, 92, 0.5);
            }
            
            .link-button {
                background-color: rgba(110, 80, 112, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
            
            .link-icon {
                background: linear-gradient(135deg, rgba(157, 123, 159, 0.3) 0%, rgba(110, 80, 112, 0.3) 100%);
            }
            
            .saweria:hover {
                background: linear-gradient(to right, rgba(110, 80, 112, 0.8), rgba(255, 107, 53, 0.15));
            }
            
            .youtube:hover {
                background: linear-gradient(to right, rgba(110, 80, 112, 0.8), rgba(255, 0, 0, 0.15));
            }
            
            .discord:hover {
                background: linear-gradient(to right, rgba(110, 80, 112, 0.8), rgba(88, 101, 242, 0.15));
            }
            
            .tiktok:hover {
                background: linear-gradient(to right, rgba(110, 80, 112, 0.8), rgba(0, 0, 0, 0.15));
            }
            
            .circle {
                background: radial-gradient(circle, rgba(157, 123, 159, 0.2) 0%, rgba(157, 123, 159, 0) 70%);
            }
            
            .social-icons a {
                background: rgba(157, 123, 159, 0.3);
            }
            
            .social-icons a:hover {
                background: rgba(157, 123, 159, 0.5);
            }
            
            .flower {
                color: rgba(157, 123, 159, 0.4);
            }
        }
    </style>
</head>
<body>
    <!-- Latar belakang dekoratif dengan pink pastel -->
    <div class="bg-decoration">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
    
    <!-- Efek bunga jatuh -->
    <div id="flowers"></div>
    
    <div class="container">
        <div class="profile">
            <div class="avatar-container">
                <img src="https://images.unsplash.com/photo-1521146764736-56c929d59c83?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80" alt="Avatar" class="avatar">
            </div>
            <h1>Support my Social Media</h1>
            <p class="description">
                Ikuti semua Social Media Acu..!
            </p>
        </div>
        
        <div class="links">
            <a href="https://saweria.co/oonous" target="_blank" class="link-button saweria">
                <div class="link-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="link-text">Saweria</div>
                <div class="link-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
            
            <a href="https://www.youtube.com/@ooonouS" target="_blank" class="link-button youtube">
                <div class="link-icon">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="link-text">YouTube</div>
                <div class="link-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
            
            <a href="discord.html" target="_blank" class="link-button discord">
                <div class="link-icon">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="link-text">Discord Community</div>
                <div class="link-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
            
            <a href="https://www.tiktok.com/@oonous" target="_blank" class="link-button tiktok">
                <div class="link-icon">
                    <i class="fab fa-tiktok"></i>
                </div>
                <div class="link-text">Follow on TikTok</div>
                <div class="link-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
        </div>
        
        <footer>
            <div class="footer-text">
                <p>© 2023 • Links Portfolio</p>
                <p>Designed with simplicity and elegance</p>
            </div>
            <div class="social-icons">
                <a href="#"><i class="fas fa-globe"></i></a>
                <a href="#"><i class="fas fa-envelope"></i></a>
                <a href="#"><i class="fas fa-share-alt"></i></a>
            </div>
        </footer>
    </div>

    <script>
        // Efek bunga jatuh
        document.addEventListener('DOMContentLoaded', function() {
            const flowersContainer = document.getElementById('flowers');
            const flowerCount = 12;
            const flowerIcons = ['❀', '✿', '❁', '🌸', '💮'];
            
            for (let 2 = 0; 2 < flowerCount; 2++) {
                const flower = document.createElement('div');
                flower.classList.add('flower');
                
                // Pilih ikon bunga acak
                const icon = flowerIcons[Math.floor(Math.random() * flowerIcons.length)];
                flower.textContent = icon;
                
                // Posisi horizontal acak
                flower.style.left = `${Math.random() * 100}vw`;
                
                // Ukuran acak
                const size = Math.random() * 25 + 15;
                flower.style.fontSize = `${size}px`;
                
                // Durasi dan delay animasi acak
                const duration = Math.random() * 10 + 8;
                const delay = Math.random() * 5;
                flower.style.animation = `fall ${duration}s linear infinite ${delay}s`;
                
                // Opasitas acak
                flower.style.opacity = Math.random() * 0.4 + 0.3;
                
                flowersContainer.appendChild(flower);
            }
            
            // Efek klik pada tombol
            const buttons = document.querySelectorAll('.link-button');
            
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // Cegah navigasi langsung untuk memberi waktu efek visual
                    e.preventDefault();
                    
                    // Efek tekan
                    this.style.transform = 'translateY(-2px) scale(0.99)';
                    
                    // Kembalikan setelah 150ms
                    setTimeout(() => {
                        this.style.transform = 'translateY(-6px)';
                    }, 150);
                    
                    // Tambahkan efek hati kecil
                    const heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.style.position = 'absolute';
                    heart.style.fontSize = '20px';
                    heart.style.zIndex = '1000';
                    heart.style.pointerEvents = 'none';
                    heart.style.animation = 'floatUp 1s ease-out forwards';
                    
                    // Posisi hati di atas tombol
                    const rect = this.getBoundingClientRect();
                    heart.style.left = `${rect.left + rect.width/2 - 10}px`;
                    heart.style.top = `${rect.top}px`;
                    
                    document.body.appendChild(heart);
                    
                    // Hapus hati setelah animasi selesai
                    setTimeout(() => {
                        heart.remove();
                    }, 1000);
                    
                    // Buka link setelah delay
                    setTimeout(() => {
                        window.open(this.href, '_blank');
                    }, 300);
                });
                
                // Efek hover untuk panah
                button.addEventListener('mouseenter', function() {
                    const arrow = this.querySelector('.link-arrow');
                    arrow.style.transform = 'translateX(8px)';
                    arrow.style.color = getComputedStyle(document.documentElement)
                        .getPropertyValue('--accent-color');
                });
                
                button.addEventListener('mouseleave', function() {
                    const arrow = this.querySelector('.link-arrow');
                    if (!this.classList.contains('clicked')) {
                        arrow.style.transform = 'translateX(0)';
                        arrow.style.color = '';
                    }
                });
            });
            
            // Animasi muncul bertahap
            const elements = document.querySelectorAll('.profile, .link-button, footer');
            
            // Jalankan animasi setelah halaman dimuat
            setTimeout(() => {
                elements.forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            }, 200);
            
            // Interaksi dengan avatar
            const avatar = document.querySelector('.avatar-container');
            avatar.addEventListener('mouseenter', function() {
                this.style.transform = 'scale(1.05)';
                this.style.boxShadow = '0 15px 30px rgba(255, 150, 200, 0.3)';
            });
            
            avatar.addEventListener('mouseleave', function() {
                this.style.transform = 'scale(1)';
                this.style.boxShadow = '0 10px 25px rgba(255, 150, 200, 0.2)';
            });
        });
        
        // Tambahkan animasi untuk hati yang melayang
        const style = document.createElement('style');
        style.textContent = `
            @keyframes floatUp {
                0% {
                    transform: translateY(0) scale(1);
                    opacity: 1;
                }
                100% {
                    transform: translateY(-50px) scale(0.5);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
        
        // Deteksi perubahan mode gelap/terang
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
            // Refresh efek bunga untuk mengupdate warna
            location.reload();
        });
    </script>
</body>
</html>
