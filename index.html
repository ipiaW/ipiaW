<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #faf9f7;
            --card-color: #ffffff;
            --text-color: #2c3e50;
            --text-light: #7f8c8d;
            --accent-color: #e74c3c;
            --border-color: #eaeaea;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background-color: var(--card-color);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #ff6b35, #ffa62e, #ff0000, #5865f2, #000000);
        }

        .profile {
            margin-bottom: 40px;
            position: relative;
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            padding: 3px;
            background-color: white;
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .description {
            font-size: 16px;
            color: var(--text-light);
            max-width: 400px;
            margin: 0 auto 30px;
            font-weight: 300;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }

        .link-button {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            font-size: 16px;
            transition: all 0.3s ease;
            border: 1px solid var(--border-color);
            background-color: var(--card-color);
            position: relative;
            overflow: hidden;
        }

        .link-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.02), transparent);
            transition: left 0.7s ease;
        }

        .link-button:hover::before {
            left: 100%;
        }

        .link-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-color: #ddd;
        }

        .link-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 20px;
            border-radius: 10px;
            background-color: rgba(0,0,0,0.03);
            transition: all 0.3s ease;
        }

        .link-button:hover .link-icon {
            transform: scale(1.1);
        }

        .link-text {
            flex-grow: 1;
            text-align: left;
            font-weight: 500;
        }

        .link-arrow {
            color: var(--text-light);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .link-button:hover .link-arrow {
            transform: translateX(5px);
            color: var(--accent-color);
        }

        /* Warna ikon dan efek hover */
        .saweria .link-icon {
            color: #ff6b35;
            background-color: rgba(255, 107, 53, 0.08);
        }

        .youtube .link-icon {
            color: #ff0000;
            background-color: rgba(255, 0, 0, 0.08);
        }

        .discord .link-icon {
            color: #5865f2;
            background-color: rgba(88, 101, 242, 0.08);
        }

        .tiktok .link-icon {
            color: #000000;
            background-color: rgba(0, 0, 0, 0.08);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            width: 100%;
            font-weight: 300;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-icons a {
            color: var(--text-light);
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .social-icons a:hover {
            color: var(--accent-color);
            transform: translateY(-3px);
        }

        /* Animasi untuk elemen */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile, .link-button, footer {
            animation: fadeInUp 0.5s ease forwards;
        }

        .link-button:nth-child(1) { animation-delay: 0.1s; }
        .link-button:nth-child(2) { animation-delay: 0.2s; }
        .link-button:nth-child(3) { animation-delay: 0.3s; }
        .link-button:nth-child(4) { animation-delay: 0.4s; }
        footer { animation-delay: 0.5s; }

        /* Responsive design */
        @media (max-width: 640px) {
            .container {
                padding: 30px 20px;
                border-radius: 16px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .description {
                font-size: 15px;
            }
            
            .link-button {
                padding: 16px 20px;
            }
            
            .avatar-container {
                width: 90px;
                height: 90px;
            }
        }

        /* Mode gelap opsional */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a1a1a;
                --card-color: #2d2d2d;
                --text-color: #f5f5f5;
                --text-light: #b0b0b0;
                --border-color: #444444;
                --shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            }
            
            .link-icon {
                background-color: rgba(255,255,255,0.05);
            }
        }

        /* Efek ripple untuk tombol */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.1);
            transform: scale(0);
            animation: ripple 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="avatar-container">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=500&q=80" alt="Avatar" class="avatar">
            </div>
            <h1>Media Sosial</h1>
            <p class="description">
                Temukan saya di berbagai platform untuk konten menarik, kolaborasi, dan komunikasi.
            </p>
        </div>
        
        <div class="links">
            <a href="https://saweria.co" target="_blank" class="link-button saweria">
                <div class="link-icon">
                    <i class="fas fa-hand-holding-heart"></i>
                </div>
                <div class="link-text">Saweria</div>
                <div class="link-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
            
            <a href="https://youtube.com" target="_blank" class="link-button youtube">
                <div class="link-icon">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="link-text">YouTube</div>
                <div class="link-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
            
            <a href="https://discord.com" target="_blank" class="link-button discord">
                <div class="link-icon">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="link-text">Discord</div>
                <div class="link-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
            
            <a href="https://tiktok.com" target="_blank" class="link-button tiktok">
                <div class="link-icon">
                    <i class="fab fa-tiktok"></i>
                </div>
                <div class="link-text">TikTok</div>
                <div class="link-arrow">
                    <i class="fas fa-arrow-right"></i>
                </div>
            </a>
        </div>
        
        <footer>
            <p>© 2023 • Links</p>
            <p>Website minimalis dengan HTML dan CSS murni</p>
            <div class="social-icons">
                <a href="#"><i class="fas fa-globe"></i></a>
                <a href="#"><i class="fas fa-envelope"></i></a>
                <a href="#"><i class="fas fa-rss"></i></a>
            </div>
        </footer>
    </div>

    <script>
        // Efek ripple untuk tombol
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.link-button');
            
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // Cegah navigasi langsung untuk memberi waktu animasi
                    e.preventDefault();
                    
                    // Buat efek ripple
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.classList.add('ripple');
                    ripple.style.cssText = `
                        width: ${size}px;
                        height: ${size}px;
                        top: ${y}px;
                        left: ${x}px;
                    `;
                    
                    this.appendChild(ripple);
                    
                    // Hapus ripple setelah animasi selesai
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                    
                    // Buka link setelah delay kecil
                    setTimeout(() => {
                        window.open(this.href, '_blank');
                    }, 300);
                });
                
                // Efek hover untuk arrow
                button.addEventListener('mouseenter', function() {
                    const arrow = this.querySelector('.link-arrow');
                    arrow.style.transform = 'translateX(5px)';
                    arrow.style.color = getComputedStyle(document.documentElement).getPropertyValue('--accent-color');
                });
                
                button.addEventListener('mouseleave', function() {
                    const arrow = this.querySelector('.link-arrow');
                    arrow.style.transform = 'translateX(0)';
                    arrow.style.color = '';
                });
            });
            
            // Animasi muncul bertahap
            const elements = document.querySelectorAll('.profile, .link-button, footer');
            elements.forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
            });
            
            // Setelah halaman dimuat, jalankan animasi
            setTimeout(() => {
                elements.forEach(el => {
                    el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            }, 100);
        });
    </script>
</body>
</html>
