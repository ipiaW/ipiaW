<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Social Links</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="https://i.pravatar.cc/150?img=3" alt="Profile" class="profile-img">
            <h1>Nama Anda</h1>
            <p>Content Creator | Developer | Gamer</p>
        </div>

        <div class="button-grid">
            <a href="https://saweria.co/username" target="_blank" class="btn btn-saweria">
                <i class="fas fa-coffee"></i>
                <span>Saweria</span>
            </a>

            <a href="https://youtube.com/@username" target="_blank" class="btn btn-youtube">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>

            <a href="https://discord.gg/invite" target="_blank" class="btn btn-discord">
                <i class="fab fa-discord"></i>
                <span>Discord</span>
            </a>

            <a href="https://tiktok.com/@username" target="_blank" class="btn btn-tiktok">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2024 | Made with <i class="fas fa-heart"></i> by Anda</p>
    </div>
</body>
</html>
