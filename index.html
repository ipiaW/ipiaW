<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Digital Space</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="gradient-bg"></div>

    <!-- Main Container -->
    <main class="card">
        <!-- Profile Section -->
        <div class="profile">
            <div class="avatar-wrapper">
                <img src="https://i.pravatar.cc/150?img=3" alt="Profile" class="avatar">
                <div class="avatar-ring"></div>
            </div>
            <h1 class="name">Your Name</h1>
            <p class="bio">Creating digital experiences with passion</p>
        </div>

        <!-- Social Links -->
        <div class="links">
            <a href="https://saweria.co/yourusername" target="_blank" class="link-btn saweria">
                <i class="fas fa-coffee"></i>
                <span>Saweria</span>
                <div class="ripple"></div>
            </a>

            <a href="https://youtube.com/@yourusername" target="_blank" class="link-btn youtube">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
                <div class="ripple"></div>
            </a>

            <a href="https://discord.gg/yourinvite" target="_blank" class="link-btn discord">
                <i class="fab fa-discord"></i>
                <span>Discord</span>
                <div class="ripple"></div>
            </a>

            <a href="https://tiktok.com/@yourusername" target="_blank" class="link-btn tiktok">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
                <div class="ripple"></div>
            </a>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Made with <i class="fas fa-heart"></i> & Code</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
