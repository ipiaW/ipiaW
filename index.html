<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8f9ff 0%, #eef1ff 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .header {
            margin-bottom: 60px;
        }

        .title {
            font-size: 36px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: #718096;
            font-weight: 400;
            max-width: 600px;
            margin: 0 auto;
        }

        .links-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }

        .social-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 25px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-width: 200px;
            min-height: 150px;
        }

        .social-button:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .social-icon {
            font-size: 36px;
            margin-bottom: 15px;
            transition: transform 0.3s ease;
        }

        .social-button:hover .social-icon {
            transform: scale(1.2);
        }

        .social-text {
            font-size: 16px;
            letter-spacing: 0.5px;
        }

        /* Warna untuk setiap tombol */
        .saweria {
            background: linear-gradient(135deg, #FF6B35 0%, #FFA62E 100%);
        }

        .tiktok {
            background: linear-gradient(135deg, #000000 0%, #25F4EE 50%, #FE2C55 100%);
            background-size: 200% 200%;
            animation: tiktok-gradient 3s ease infinite;
        }

        .youtube {
            background: linear-gradient(135deg, #FF0000 0%, #C4302B 100%);
        }

        .discord {
            background: linear-gradient(135deg, #5865F2 0%, #7289DA 100%);
        }

        /* Animasi khusus untuk TikTok */
        @keyframes tiktok-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #718096;
            font-size: 14px;
            font-weight: 400;
            padding-top: 25px;
            border-top: 1px solid rgba(113, 128, 150, 0.1);
            width: 100%;
        }

        /* Responsive design */
        @media (max-width: 1100px) {
            .social-button {
                min-width: 180px;
                min-height: 140px;
                padding: 25px 20px;
            }
            
            .social-icon {
                font-size: 32px;
            }
        }

        @media (max-width: 900px) {
            .links-container {
                gap: 15px;
            }
            
            .social-button {
                min-width: 160px;
                min-height: 130px;
                padding: 22px 18px;
            }
            
            .title {
                font-size: 32px;
            }
            
            .subtitle {
                font-size: 17px;
            }
        }

        @media (max-width: 768px) {
            .links-container {
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .social-button {
                min-width: 45%;
                max-width: 200px;
                min-height: 120px;
            }
            
            .container {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 16px;
            }
        }

        @media (max-width: 576px) {
            .links-container {
                flex-direction: column;
                align-items: center;
            }
            
            .social-button {
                width: 100%;
                max-width: 300px;
                min-height: 110px;
                flex-direction: row;
                justify-content: flex-start;
                padding: 20px 25px;
            }
            
            .social-icon {
                margin-bottom: 0;
                margin-right: 20px;
                font-size: 30px;
            }
            
            .social-text {
                font-size: 17px;
            }
            
            .title {
                font-size: 26px;
            }
        }

        /* Mode gelap */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                color: #f0f0f0;
            }
            
            .title {
                background: linear-gradient(135deg, #a78bfa 0%, #c4b5fd 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            
            .subtitle {
                color: #a0aec0;
            }
            
            footer {
                color: #a0aec0;
                border-top: 1px solid rgba(160, 174, 192, 0.1);
            }
        }

        /* Efek hover tambahan */
        .social-button::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .social-button:hover::after {
            opacity: 1;
        }
        
        /* Animasi masuk */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .social-button {
            animation: fadeIn 0.5s ease forwards;
            opacity: 0;
        }
        
        .social-button:nth-child(1) { animation-delay: 0.1s; }
        .social-button:nth-child(2) { animation-delay: 0.2s; }
        .social-button:nth-child(3) { animation-delay: 0.3s; }
        .social-button:nth-child(4) { animation-delay: 0.4s; }
        
        /* Tombol baris horizontal (alternatif) */
        .horizontal-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 50px auto;
            max-width: 1000px;
        }
        
        .horizontal-button {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 30px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            flex: 1;
            min-width: 180px;
            max-width: 220px;
        }
        
        .horizontal-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .horizontal-icon {
            font-size: 24px;
            margin-right: 12px;
        }
        
        @media (max-width: 768px) {
            .horizontal-buttons {
                flex-wrap: wrap;
            }
            
            .horizontal-button {
                min-width: 45%;
                margin-bottom: 15px;
            }
        }
        
        @media (max-width: 576px) {
            .horizontal-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .horizontal-button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Social Media Links</h1>
            <p class="subtitle">Connect with me across different platforms for exclusive content and updates</p>
        </div>
        
        <!-- Versi 1: Tombol dengan ikon besar di atas teks -->
        <div class="links-container">
            <a href="https://saweria.co" target="_blank" class="social-button saweria">
                <div class="social-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="social-text">Saweria</div>
            </a>
            
            <a href="https://tiktok.com" target="_blank" class="social-button tiktok">
                <div class="social-icon">
                    <i class="fab fa-tiktok"></i>
                </div>
                <div class="social-text">TikTok</div>
            </a>
            
            <a href="https://youtube.com" target="_blank" class="social-button youtube">
                <div class="social-icon">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="social-text">YouTube</div>
            </a>
            
            <a href="https://discord.com" target="_blank" class="social-button discord">
                <div class="social-icon">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="social-text">Discord</div>
            </a>
        </div>
        
        <!-- Versi 2: Tombol horizontal dengan ikon dan teks sejajar -->
        <div class="horizontal-buttons">
            <a href="https://saweria.co" target="_blank" class="horizontal-button saweria">
                <div class="horizontal-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="social-text">Saweria</div>
            </a>
            
            <a href="https://tiktok.com" target="_blank" class="horizontal-button tiktok">
                <div class="horizontal-icon">
                    <i class="fab fa-tiktok"></i>
                </div>
                <div class="social-text">TikTok</div>
            </a>
            
            <a href="https://youtube.com" target="_blank" class="horizontal-button youtube">
                <div class="horizontal-icon">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="social-text">YouTube</div>
            </a>
            
            <a href="https://discord.com" target="_blank" class="horizontal-button discord">
                <div class="horizontal-icon">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="social-text">Discord</div>
            </a>
        </div>
        
        <footer>
            <p>© 2023 • All Social Media Links</p>
            <p style="margin-top: 8px; font-size: 13px;">Saweria • TikTok • YouTube • Discord</p>
        </footer>
    </div>

    <script>
        // Animasi tombol saat halaman dimuat
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.social-button, .horizontal-button');
            
            // Efek hover untuk ikon
            buttons.forEach(button => {
                button.addEventListener('mouseenter', function() {
                    const icon = this.querySelector('.social-icon, .horizontal-icon');
                    if (icon) {
                        icon.style.transform = 'scale(1.2)';
                    }
                });
                
                button.addEventListener('mouseleave', function() {
                    const icon = this.querySelector('.social-icon, .horizontal-icon');
                    if (icon) {
                        icon.style.transform = 'scale(1)';
                    }
                });
                
                // Efek klik
                button.addEventListener('click', function(e) {
                    // Efek visual saat diklik
                    this.style.transform = 'translateY(-2px) scale(0.98)';
                    
                    setTimeout(() => {
                        this.style.transform = 'translateY(-10px)';
                    }, 100);
                    
                    // Buka link di tab baru setelah delay kecil
                    setTimeout(() => {
                        window.open(this.href, '_blank');
                    }, 200);
                });
            });
            
            // Animasikan tombol masuk
            setTimeout(() => {
                buttons.forEach(button => {
                    button.style.opacity = '1';
                });
            }, 300);
            
            // Tampilkan hanya satu versi tombol (pilih salah satu)
            // Untuk menampilkan hanya versi pertama, hapus komentar baris berikut:
            // document.querySelector('.horizontal-buttons').style.display = 'none';
            
            // Untuk menampilkan hanya versi kedua, hapus komentar baris berikut:
            // document.querySelector('.links-container').style.display = 'none';
        });
    </script>
</body>
</html>
