<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Links</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9ff 0%, #eef1ff 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 60px;
        }

        .title {
            font-family: 'Inter', sans-serif;
            font-size: 32px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: #718096;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
        }

        .links-horizontal {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .social-button-horizontal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 25px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-width: 180px;
            min-height: 140px;
            flex: 1;
            max-width: 220px;
        }

        .social-button-horizontal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .social-button-horizontal:hover::before {
            opacity: 1;
        }

        .social-button-horizontal:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .social-icon-horizontal {
            font-size: 32px;
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }

        .social-button-horizontal:hover .social-icon-horizontal {
            transform: scale(1.2) rotate(5deg);
        }

        .social-text-horizontal {
            font-size: 15px;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        /* Warna untuk setiap tombol */
        .saweria-horizontal {
            background: linear-gradient(135deg, #FF6B35 0%, #FFA62E 100%);
        }

        .tiktok-horizontal {
            background: linear-gradient(135deg, #000000 0%, #25F4EE 50%, #FE2C55 100%);
            background-size: 200% 200%;
            animation: tiktok-gradient 3s ease infinite;
        }

        .youtube-horizontal {
            background: linear-gradient(135deg, #FF0000 0%, #C4302B 100%);
        }

        .discord-horizontal {
            background: linear-gradient(135deg, #5865F2 0%, #7289DA 100%);
        }

        /* Animasi khusus untuk TikTok */
        @keyframes tiktok-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: #718096;
            font-size: 14px;
            font-weight: 400;
            padding-top: 25px;
            border-top: 1px solid rgba(113, 128, 150, 0.1);
            width: 100%;
        }

        /* Animasi untuk elemen */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header, .social-button-horizontal, footer {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .social-button-horizontal:nth-child(1) { animation-delay: 0.1s; }
        .social-button-horizontal:nth-child(2) { animation-delay: 0.2s; }
        .social-button-horizontal:nth-child(3) { animation-delay: 0.3s; }
        .social-button-horizontal:nth-child(4) { animation-delay: 0.4s; }
        footer { animation-delay: 0.5s; }

        /* Responsive design */
        @media (max-width: 900px) {
            .links-horizontal {
                gap: 15px;
            }
            
            .social-button-horizontal {
                min-width: 160px;
                min-height: 130px;
                padding: 25px 20px;
            }
            
            .social-icon-horizontal {
                font-size: 28px;
            }
            
            .social-text-horizontal {
                font-size: 14px;
            }
        }

        @media (max-width: 768px) {
            .links-horizontal {
                flex-direction: column;
                align-items: center;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }
            
            .social-button-horizontal {
                width: 100%;
                max-width: 400px;
                min-height: 120px;
                padding: 25px;
                flex-direction: row;
                justify-content: flex-start;
                gap: 20px;
            }
            
            .social-icon-horizontal {
                margin-bottom: 0;
                font-size: 30px;
                width: 50px;
                text-align: center;
            }
            
            .social-text-horizontal {
                font-size: 16px;
                text-align: left;
                flex: 1;
            }
            
            .title {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 15px;
            }
            
            .title {
                font-size: 24px;
            }
            
            .subtitle {
                font-size: 15px;
            }
            
            .social-button-horizontal {
                padding: 20px;
                min-height: 110px;
            }
            
            .social-icon-horizontal {
                font-size: 28px;
                width: 45px;
            }
            
            .social-text-horizontal {
                font-size: 15px;
            }
        }

        /* Mode gelap */
        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
                color: #f0f0f0;
            }
            
            .title {
                color: #e2e8f0;
            }
            
            .subtitle {
                color: #a0aec0;
            }
            
            footer {
                color: #a0aec0;
                border-top: 1px solid rgba(160, 174, 192, 0.1);
            }
        }

        /* Efek ripple untuk tombol */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0);
            animation: rippleEffect 0.6s linear;
            pointer-events: none;
        }

        @keyframes rippleEffect {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Dekorasi background minimal */
        .bg-element {
            position: fixed;
            border-radius: 50%;
            z-index: -1;
            opacity: 0.05;
        }

        .bg-element:nth-child(1) {
            width: 300px;
            height: 300px;
            background: #FF6B35;
            top: -100px;
            right: -100px;
        }

        .bg-element:nth-child(2) {
            width: 250px;
            height: 250px;
            background: #5865F2;
            bottom: -80px;
            left: -80px;
        }

        .bg-element:nth-child(3) {
            width: 200px;
            height: 200px;
            background: #FF0000;
            top: 40%;
            left: 10%;
        }
        
        .bg-element:nth-child(4) {
            width: 180px;
            height: 180px;
            background: #000000;
            bottom: 30%;
            right: 10%;
        }
        
        /* Versi tombol horizontal alternatif */
        .links-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
        }
        
        .social-button-row {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 30px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            min-width: 160px;
        }
        
        .social-button-row:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .social-icon-row {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .social-text-row {
            font-size: 15px;
        }
        
        /* Warna untuk tombol versi row */
        .saweria-row {
            background: linear-gradient(to right, #FF6B35 0%, #FFA62E 100%);
        }

        .tiktok-row {
            background: linear-gradient(to right, #000000 0%, #25F4EE 50%, #FE2C55 100%);
            background-size: 200% 100%;
            animation: tiktok-gradient-row 3s ease infinite;
        }

        .youtube-row {
            background: linear-gradient(to right, #FF0000 0%, #C4302B 100%);
        }

        .discord-row {
            background: linear-gradient(to right, #5865F2 0%, #7289DA 100%);
        }
        
        @keyframes tiktok-gradient-row {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Untuk mobile, tombol row menjadi vertikal */
        @media (max-width: 768px) {
            .links-row {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            
            .social-button-row {
                width: 100%;
                max-width: 300px;
                justify-content: center;
                padding: 18px 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Dekorasi background minimal -->
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    <div class="bg-element"></div>
    
    <div class="container">
        <div class="header">
            <h1 class="title">Social Links</h1>
            <p class="subtitle">Connect with me on different platforms for content, support, and community</p>
        </div>
        
        <!-- Versi 1: Tombol horizontal dengan ikon di atas teks -->
        <div class="links-horizontal">
            <a href="https://saweria.co" target="_blank" class="social-button-horizontal saweria-horizontal">
                <div class="social-icon-horizontal">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="social-text-horizontal">Saweria</div>
            </a>
            
            <a href="https://tiktok.com" target="_blank" class="social-button-horizontal tiktok-horizontal">
                <div class="social-icon-horizontal">
                    <i class="fab fa-tiktok"></i>
                </div>
                <div class="social-text-horizontal">TikTok</div>
            </a>
            
            <a href="https://youtube.com" target="_blank" class="social-button-horizontal youtube-horizontal">
                <div class="social-icon-horizontal">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="social-text-horizontal">YouTube</div>
            </a>
            
            <a href="https://discord.com" target="_blank" class="social-button-horizontal discord-horizontal">
                <div class="social-icon-horizontal">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="social-text-horizontal">Discord</div>
            </a>
        </div>
        
        <!-- Versi 2: Tombol horizontal dengan ikon dan teks sejajar -->
        <div class="links-row">
            <a href="https://saweria.co" target="_blank" class="social-button-row saweria-row">
                <div class="social-icon-row">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="social-text-row">Saweria</div>
            </a>
            
            <a href="https://tiktok.com" target="_blank" class="social-button-row tiktok-row">
                <div class="social-icon-row">
                    <i class="fab fa-tiktok"></i>
                </div>
                <div class="social-text-row">TikTok</div>
            </a>
            
            <a href="https://youtube.com" target="_blank" class="social-button-row youtube-row">
                <div class="social-icon-row">
                    <i class="fab fa-youtube"></i>
                </div>
                <div class="social-text-row">YouTube</div>
            </a>
            
            <a href="https://discord.com" target="_blank" class="social-button-row discord-row">
                <div class="social-icon-row">
                    <i class="fab fa-discord"></i>
                </div>
                <div class="social-text-row">Discord</div>
            </a>
        </div>
        
        <footer>
            <p>© 2023 • All social media links</p>
            <p style="margin-top: 5px; font-size: 12px;">Tombol horizontal dengan 4 platform media sosial</p>
        </footer>
    </div>

    <script>
        // Efek ripple untuk tombol
        document.addEventListener('DOMContentLoaded', function() {
            const buttons = document.querySelectorAll('.social-button-horizontal, .social-button-row');
            
            buttons.forEach(button => {
                button.addEventListener('click', function(e) {
                    // Buat efek ripple
                    const ripple = document.createElement('span');
                    const rect = this.getBoundingClientRect();
                    const size = Math.max(rect.width, rect.height);
                    const x = e.clientX - rect.left - size / 2;
                    const y = e.clientY - rect.top - size / 2;
                    
                    ripple.classList.add('ripple');
                    ripple.style.width = `${size}px`;
                    ripple.style.height = `${size}px`;
                    ripple.style.top = `${y}px`;
                    ripple.style.left = `${x}px`;
                    
                    this.appendChild(ripple);
                    
                    // Hapus ripple setelah animasi selesai
                    setTimeout(() => {
                        ripple.remove();
                    }, 600);
                    
                    // Efek tekan untuk tombol horizontal
                    if (this.classList.contains('social-button-horizontal')) {
                        this.style.transform = 'translateY(-5px) scale(0.98)';
                        
                        setTimeout(() => {
                            this.style.transform = 'translateY(-10px) scale(1.05)';
                        }, 150);
                    }
                    
                    // Efek tekan untuk tombol row
                    if (this.classList.contains('social-button-row')) {
                        this.style.transform = 'translateY(-3px) scale(0.98)';
                        
                        setTimeout(() => {
                            this.style.transform = 'translateY(-5px)';
                        }, 150);
                    }
                    
                    // Buka link setelah delay kecil
                    setTimeout(() => {
                        window.open(this.href, '_blank');
                    }, 300);
                });
                
                // Efek hover untuk ikon tombol horizontal
                if (button.classList.contains('social-button-horizontal')) {
                    button.addEventListener('mouseenter', function() {
                        const icon = this.querySelector('.social-icon-horizontal');
                        icon.style.transform = 'scale(1.2) rotate(5deg)';
                    });
                    
                    button.addEventListener('mouseleave', function() {
                        const icon = this.querySelector('.social-icon-horizontal');
                        if (!this.classList.contains('clicked')) {
                            icon.style.transform = 'scale(1) rotate(0deg)';
                        }
                    });
                }
            });
            
            // Animasi muncul bertahap
            const elements = document.querySelectorAll('.header, .social-button-horizontal, .social-button-row, footer');
            
            setTimeout(() => {
                elements.forEach(el => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                });
            }, 100);
            
            // Hanya tampilkan satu versi tombol (komentar salah satu untuk melihat perbedaan)
            // Secara default, kedua versi ditampilkan untuk perbandingan
            // Untuk hanya menampilkan versi horizontal dengan ikon di atas teks:
            // document.querySelector('.links-row').style.display = 'none';
            
            // Untuk hanya menampilkan versi row dengan ikon dan teks sejajar:
            // document.querySelector('.links-horizontal').style.display = 'none';
        });
    </script>
</body>
</html>
