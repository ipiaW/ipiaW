<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Digital Space</title>
    <link rel="stylesheet" href="style.css">
    <!-- Import Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Animasi Latar Belakang -->
        <div class="bg-animation">
            <div class="bubble"></div>
            <div class="bubble"></div>
            <div class="bubble"></div>
        </div>

        <!-- Konten Utama -->
        <main class="profile-card">
            <!-- Foto Profil -->
            <div class="profile-image">
                <img src="https://i.pravatar.cc/150?img=3" alt="Profile">
            </div>

            <!-- Nama dan Deskripsi -->
            <h1 class="name">Your Name</h1>
            <p class="bio">Content Creator | Digital Enthusiast | Game Developer</p>
            
            <!-- Tombol Social Media -->
            <div class="button-container">
                <a href="https://saweria.co/yourusername" target="_blank" class="btn btn-saweria">
                    <i class="fas fa-coffee"></i>
                    <span>Saweria</span>
                </a>

                <a href="https://youtube.com/@yourusername" target="_blank" class="btn btn-youtube">
                    <i class="fab fa-youtube"></i>
                    <span>YouTube</span>
                </a>

                <a href="https://discord.gg/yourinvite" target="_blank" class="btn btn-discord">
                    <i class="fab fa-discord"></i>
                    <span>Discord</span>
                </a>

                <a href="https://tiktok.com/@yourusername" target="_blank" class="btn btn-tiktok">
                    <i class="fab fa-tiktok"></i>
                    <span>TikTok</span>
                </a>
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2024 Your Name. Made with <i class="fas fa-heart"></i> and Code</p>
    </footer>
</body>
</html>
