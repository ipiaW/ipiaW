<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Moonlight Space</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Dark Sky Background -->
    <div class="night-sky">
        <div class="stars"></div>
        <div class="aurora"></div>
        <div class="twinkling-stars"></div>
    </div>

    <!-- Moon Decoration -->
    <div class="moon"></div>

    <!-- Main Card -->
    <div class="stellar-card">
        <!-- Floating Glow -->
        <div class="card-glow"></div>
        
        <!-- Constellation Pattern -->
        <div class="constellation"></div>

        <!-- Profile Section -->
        <div class="stellar-profile">
            <div class="avatar-orbit">
                <img src="https://i.pravatar.cc/150?img=33" alt="Profile" class="stellar-avatar">
                <div class="orbit-ring"></div>
            </div>
            
            <h1 class="stellar-name">
                <span class="star-icon"><i class="fas fa-star"></i></span>
                <span class="main-name">Starlight</span>
                <span class="last-name">Dreamer</span>
            </h1>
            
            <p class="stellar-bio">
                <i class="fas fa-feather"></i>
                <span>Writing dreams in the night sky</span>
                <i class="fas fa-feather"></i>
            </p>
        </div>

        <!-- Social Constellations -->
        <div class="stellar-links">
            <a href="https://saweria.co/yourusername" target="_blank" class="stellar-btn constellation-btn">
                <div class="btn-icon"><i class="fas fa-coffee"></i></div>
                <span class="btn-label">Saweria</span>
                <div class="btn-orbit"></div>
            </a>

            <a href="https://youtube.com/@yourusername" target="_blank" class="stellar-btn constellation-btn">
                <div class="btn-icon"><i class="fab fa-youtube"></i></div>
                <span class="btn-label">YouTube</span>
                <div class="btn-orbit"></div>
            </a>

            <a href="https://discord.gg/yourinvite" target="_blank" class="stellar-btn constellation-btn">
                <div class="btn-icon"><i class="fab fa-discord"></i></div>
                <span class="btn-label">Discord</span>
                <div class="btn-orbit"></div>
            </a>

            <a href="https://tiktok.com/@yourusername" target="_blank" class="stellar-btn constellation-btn">
                <div class="btn-icon"><i class="fab fa-tiktok"></i></div>
                <span class="btn-label">TikTok</span>
                <div class="btn-orbit"></div>
            </a>
        </div>

        <!-- Night Footer -->
        <footer class="night-footer">
            <div class="shooting-star"></div>
            <p>Under the same sky <i class="fas fa-moon"></i></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
